name: News candidate collection
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'all / core / retry (previous failed or partial sources)'
        required: true
        default: all
        type: choice
        options: [all, core, retry]
  schedule:
    # UTC; JST 05:27 and 06:18 are full and core-plus-retry passes, respectively.
    - cron: '17 0,6,12,18 * * *'
    - cron: '27 20 * * *'
    - cron: '18 21 * * *'
permissions:
  contents: write
concurrency:
  group: news-collector-main
  cancel-in-progress: false
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify collector tests before collection
        run: python -m unittest discover -s tests -v
      - name: Fetch and compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python collector.py --scope "${REQUESTED_SCOPE:-all}"
          elif [ "$SCHEDULE" = '27 20 * * *' ]; then
            python collector.py --scope all
          elif [ "$SCHEDULE" = '18 21 * * *' ]; then
            python collector.py --scope core
          else
            python collector.py --scope core --enrich-limit 40
          fi
      - name: Commit updated public candidate index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Collect news candidates $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo 'No changes'
          fi
