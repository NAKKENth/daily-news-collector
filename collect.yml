name: News candidate collection
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'core (faster) or all (full registered automatic sources)'
        required: false
        default: all
        type: choice
        options: [core, all]
  schedule:
    # UTC. At 00:17/06:17/12:17/18:17 UTC for intermediate collection
    # 20:27 UTC = 05:27 JST full-scan baseline; 21:38 UTC = 06:38 JST refresh.
    - cron: '17 0,6,12,18 * * *'
    - cron: '27 20 * * *'
    - cron: '38 21 * * *'
permissions:
  contents: write
concurrency:
  group: news-collector-main
  cancel-in-progress: false
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fetch and compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python collector.py --scope '${{ inputs.scope }}'
          elif [ "${{ github.event.schedule }}" = "38 21 * * *" ] || [ "${{ github.event.schedule }}" = "27 20 * * *" ]; then
            python collector.py --scope all
          else
            python collector.py --scope core
          fi
      - name: Verify data consistency
        run: python -m unittest discover -s tests -v
      - name: Commit updated public candidate index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Collect news candidates $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo 'No changes'
          fi
